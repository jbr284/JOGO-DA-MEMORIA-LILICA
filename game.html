<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="theme-color" content="#16213e">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #1a1a2e; --card-color: #16213e; --card-flipped-color: #0f3460;
      --text-color: #e94560; --accent-color: #ffffff;
      --player1-color: #53a8b6; --player2-color: #e94560;
      --board-gap: 6px;
      --card-size: min(80px, 9vh, calc((100vw - 30px - (7 * var(--board-gap))) / 8)); 
    }

    body {
      font-family: 'Arial', sans-serif; background-color: var(--bg-color); color: var(--accent-color);
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 10px; box-sizing: border-box;
      user-select: none; touch-action: none; overflow-x: hidden;
    }

    h1 { color: var(--text-color); margin: 10px 0; font-size: 1.5em; }
    .game-info { display: flex; gap: 10px; width: 100%; max-width: 500px; margin-bottom: 15px; }
    .player-card { flex: 1; background: rgba(22, 33, 62, 0.6); border-radius: 12px; padding: 10px; border: 2px solid transparent; transition: 0.3s; }
    .player-card.p1 { border-color: var(--player1-color); color: var(--player1-color); }
    .player-card.p2 { border-color: var(--player2-color); color: var(--player2-color); }
    .player-card.active { background: rgba(255, 255, 255, 0.05); transform: translateY(-3px); }
    .player-header { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
    .player-name { font-size: 0.9em; font-weight: bold; overflow: hidden; text-overflow: ellipsis; }
    .stats-container { display: flex; gap: 10px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 10px; justify-content: center; }
    .stat-box { display: flex; flex-direction: column; align-items: center; font-size: 0.8em; }
    .stat-value { font-size: 1.4em; font-weight: 800; color: white; }

    #turn-info { font-weight: bold; margin-bottom: 10px; color: #ccc; }
    .game-board { display: grid; grid-template-columns: repeat(8, var(--card-size)); gap: var(--board-gap); }
    .card { width: var(--card-size); height: var(--card-size); position: relative; transform-style: preserve-3d; transition: 0.5s; cursor: pointer; }
    .card.flipped, .card.matched { transform: rotateY(180deg); }
    .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: calc(var(--card-size) * 0.5); }
    
    /* VISUAL DOS ÍCONES BRANCOS */
    .card-front { 
        background-color: var(--card-flipped-color); transform: rotateY(180deg); color: white;
        text-shadow: 0 3px 6px rgba(0,0,0,0.5); 
    }
    .card-back { background-color: var(--card-color); border: 2px solid var(--text-color); }

    #play-again-btn, #reset-button { margin-top: 15px; padding: 12px 25px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; width: 80%; max-width: 300px; }
    #play-again-btn { background-color: var(--player1-color); display: none; }
    #reset-button { background-color: var(--text-color); margin-bottom: 15px; }

    .chat-container { width: 100%; max-width: 400px; background: var(--card-color); border-radius: 8px; overflow: hidden; }
    .chat-messages { height: 120px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 0.85em; }
    .chat-msg { padding: 6px 10px; border-radius: 10px; max-width: 85%; }
    .chat-msg.opponent { background: #2a2a40; align-self: flex-start; }
    .chat-msg.self { background: var(--card-flipped-color); align-self: flex-end; }
    .chat-form { display: flex; padding: 5px; background: var(--bg-color); }
    .chat-form input { flex: 1; padding: 8px; border: none; background: var(--card-color); color: white; border-radius: 4px 0 0 4px; }
    .chat-form button { border: none; padding: 0 15px; background: var(--text-color); color: white; border-radius: 0 4px 4px 0; }
  </style>
</head>
<body>
  <h1>Jogo da Memória</h1>
  <div class="game-info">
    <div id="player1-card" class="player-card p1"><div class="player-header">🦊 <div class="player-name" id="p1-name">P1</div></div><div class="stats-container"><div class="stat-box"><span class="stat-value" id="p1-score">0</span><span>Pares</span></div><div class="stat-box"><span class="stat-value" id="p1-wins">0</span><span style="color:gold">Vit.</span></div></div></div>
    <div id="player2-card" class="player-card p2"><div class="player-header">🐼 <div class="player-name" id="p2-name">P2</div></div><div class="stats-container"><div class="stat-box"><span class="stat-value" id="p2-score">0</span><span>Pares</span></div><div class="stat-box"><span class="stat-value" id="p2-wins">0</span><span style="color:gold">Vit.</span></div></div></div>
  </div>
  <div id="turn-info">Carregando...</div>
  <div class="game-board" id="game-board"></div>
  <button id="play-again-btn">Jogar Novamente</button>
  <button id="reset-button">Voltar ao Lobby</button>
  <div class="chat-container"><div class="chat-messages" id="chat-messages"></div><form class="chat-form" id="chat-form"><input type="text" id="chat-input" placeholder="Chat..." required><button type="submit">Ok</button></form></div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyCLAsfQdpaEzk_5IFV39F0m_IyaFsGbAbc", authDomain: "jogo-da-memoria-lilica.firebaseapp.com", databaseURL: "https://jogo-da-memoria-lilica-default-rtdb.firebaseio.com", projectId: "jogo-da-memoria-lilica", storageBucket: "jogo-da-memoria-lilica.firebasestorage.app", messagingSenderId: "683788488529", appId: "1:683788488529:web:727316a3e182257a2d8d70" };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    // MESMA LISTA DO LOBBY PARA RESET DE JOGO
    const icons = ['<i class="fa-solid fa-rocket"></i>', '<i class="fa-solid fa-ghost"></i>', '<i class="fa-solid fa-robot"></i>', '<i class="fa-solid fa-bug"></i>', '<i class="fa-solid fa-bolt"></i>', '<i class="fa-solid fa-fire"></i>', '<i class="fa-solid fa-snowflake"></i>', '<i class="fa-solid fa-cloud"></i>', '<i class="fa-solid fa-sun"></i>', '<i class="fa-solid fa-star"></i>', '<i class="fa-solid fa-gem"></i>', '<i class="fa-solid fa-bomb"></i>', '<i class="fa-solid fa-crown"></i>', '<i class="fa-solid fa-gamepad"></i>', '<i class="fa-solid fa-dice"></i>', '<i class="fa-solid fa-chess-knight"></i>', '<i class="fa-solid fa-anchor"></i>', '<i class="fa-solid fa-heart"></i>', '<i class="fa-solid fa-music"></i>', '<i class="fa-solid fa-paper-plane"></i>', '<i class="fa-solid fa-car"></i>', '<i class="fa-solid fa-bicycle"></i>', '<i class="fa-solid fa-umbrella"></i>', '<i class="fa-solid fa-mug-hot"></i>', '<i class="fa-solid fa-pizza-slice"></i>', '<i class="fa-solid fa-apple-whole"></i>', '<i class="fa-solid fa-ice-cream"></i>', '<i class="fa-solid fa-paw"></i>', '<i class="fa-solid fa-skull"></i>', '<i class="fa-solid fa-feather-pointed"></i>', '<i class="fa-solid fa-tree"></i>', '<i class="fa-solid fa-leaf"></i>'];

    let gameStateRef, gameId, playerId, checkMatchTimeout = null;

    async function init() {
        const params = new URLSearchParams(window.location.search);
        gameId = params.get('game');
        const myUUID = sessionStorage.getItem('jogoMemoriaUUID');
        if (!myUUID || !gameId) { window.location.href = 'index.html'; return; }
        gameStateRef = database.ref('games/' + gameId);
        gameStateRef.transaction(cs => {
            if (!cs) return cs;
            if (cs.player1_uuid === myUUID) playerId = 1;
            else if (cs.player2_uuid === myUUID) playerId = 2;
            return cs;
        }, (err, ok) => { if (ok) setup(); });
    }

    function setup() {
        gameStateRef.on('value', snap => {
            const s = snap.val(); if (!s) return;
            document.getElementById('p1-name').textContent = s.player1_name || "P1";
            document.getElementById('p1-score').textContent = s.scores[1];
            document.getElementById('p1-wins').textContent = s.victories[1];
            document.getElementById('p2-name').textContent = s.player2_name || "P2";
            document.getElementById('p2-score').textContent = s.scores[2];
            document.getElementById('p2-wins').textContent = s.victories[2];
            document.getElementById('player1-card').classList.toggle('active', s.currentPlayer === 1);
            document.getElementById('player2-card').classList.toggle('active', s.currentPlayer === 2);
            
            const info = document.getElementById('turn-info');
            if (s.winner !== null) { 
                info.textContent = s.winner === 0 ? "Empate!" : (s.winner === 1 ? s.player1_name : s.player2_name) + " Venceu!"; 
                document.getElementById('play-again-btn').style.display = 'block';
            } else {
                info.textContent = s.currentPlayer === playerId ? "Sua vez!" : "Vez de " + (s.currentPlayer === 1 ? s.player1_name : s.player2_name);
            }

            const board = document.getElementById('game-board'); board.innerHTML = '';
            Object.values(s.board).forEach(c => {
                const el = document.createElement('div'); el.className = 'card';
                if(c.isFlipped) el.classList.add('flipped'); if(c.isMatched) el.classList.add('matched');
                el.innerHTML = `<div class="card-face card-front">${c.emoji}</div><div class="card-face card-back"></div>`;
                el.onclick = () => { if (!c.isFlipped && !c.isMatched && s.currentPlayer === playerId && !checkMatchTimeout) flip(c.id); };
                board.appendChild(el);
            });

            if (s.flippedCards?.length === 2 && s.currentPlayer === playerId && !checkMatchTimeout) {
                checkMatchTimeout = setTimeout(check, 1000);
            }
        });

        const chatRef = database.ref('games/' + gameId + '/chat');
        document.getElementById('chat-form').onsubmit = e => {
            e.preventDefault(); const inp = document.getElementById('chat-input');
            chatRef.push({ playerId, message: inp.value }); inp.value = '';
        };
        chatRef.limitToLast(20).on('child_added', snap => {
            const m = snap.val(); const d = document.createElement('div');
            d.className = 'chat-msg ' + (m.playerId === playerId ? 'self' : 'opponent');
            d.textContent = m.message; document.getElementById('chat-messages').appendChild(d);
            document.getElementById('chat-messages').scrollTop = 9999;
        });
    }

    function flip(cardId) {
        gameStateRef.transaction(s => {
            if (!s || s.winner !== null || s.currentPlayer !== playerId) return;
            const flipped = s.flippedCards || []; if (flipped.length >= 2) return;
            s.board[cardId].isFlipped = true; s.flippedCards = [...flipped, cardId];
            return s;
        });
    }

    function check() {
        gameStateRef.transaction(s => {
            if (!s || !s.flippedCards || s.flippedCards.length !== 2) return;
            const [a, b] = s.flippedCards;
            if (s.board[a].emoji === s.board[b].emoji) {
                s.scores[playerId]++; s.board[a].isMatched = s.board[b].isMatched = true; s.matchedPairs++;
            } else {
                s.board[a].isFlipped = s.board[b].isFlipped = false; s.currentPlayer = s.currentPlayer === 1 ? 2 : 1;
            }
            s.flippedCards = [];
            if (s.matchedPairs === 32) {
                if (s.scores[1] > s.scores[2]) s.winner = 1; else if (s.scores[2] > s.scores[1]) s.winner = 2; else s.winner = 0;
                if (s.winner !== 0) s.victories[s.winner]++;
            }
            return s;
        });
        checkMatchTimeout = null;
    }

    document.getElementById('play-again-btn').onclick = () => {
        gameStateRef.transaction(s => {
            if (!s) return; const pairs = [...icons, ...icons].sort(() => 0.5 - Math.random());
            s.board = {}; pairs.forEach((icon, i) => s.board[i] = { id: i, emoji: icon, isFlipped: false, isMatched: false });
            s.scores = { 1: 0, 2: 0 }; s.matchedPairs = 0; s.winner = null; s.flippedCards = []; s.chat = null;
            return s;
        });
    };
    document.getElementById('reset-button').onclick = () => window.location.href = 'index.html';
    init();
  </script>
</body>
</html>
