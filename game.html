<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <meta name="theme-color" content="#0f0f1a">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f0f1a; --bg-light: #1a1a2e; --card-color: #16213e; --card-flipped: #0f3460;
      --text-color: #ffffff; --player1-color: #00f0ff; --player2-color: #ff0055;
      --board-gap: 6px;
      --card-size: min(80px, 9vh, calc((100vw - 30px - (7 * var(--board-gap))) / 8)); 
    }

    body {
      font-family: 'Poppins', sans-serif; color: var(--text-color);
      background: radial-gradient(circle at center, var(--bg-light) 0%, var(--bg-dark) 100%);
      display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 10px;
      user-select: none; touch-action: none; overflow-x: hidden;
    }

    h1 { margin: 10px 0; font-size: 1.5em; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
    
    .game-info { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 550px; margin-bottom: 15px; }
    
    .player-card { 
      flex: 1; background: rgba(22, 33, 62, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 12px; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
    .player-card.p1 { border-top: 3px solid var(--player1-color); }
    .player-card.p2 { border-top: 3px solid var(--player2-color); }
    
    .player-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .avatar-wrapper { width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.3); border: 2px solid transparent; transition: 0.3s; font-size: 1.2em; }
    .player-name { font-size: 0.9em; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    .player-card.p1.active { box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
    .player-card.p2.active { box-shadow: 0 0 20px rgba(255, 0, 85, 0.2); }
    .player-card.p1.active .avatar-wrapper { border-color: var(--player1-color); animation: pulse-p1 1.5s infinite; }
    .player-card.p2.active .avatar-wrapper { border-color: var(--player2-color); animation: pulse-p2 1.5s infinite; }
    @keyframes pulse-p1 { 0%, 100% { box-shadow: 0 0 5px var(--player1-color); } 50% { box-shadow: 0 0 15px var(--player1-color); } }
    @keyframes pulse-p2 { 0%, 100% { box-shadow: 0 0 5px var(--player2-color); } 50% { box-shadow: 0 0 15px var(--player2-color); } }

    .stats-container { display: flex; justify-content: space-around; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 8px; }
    .stat-box { display: flex; flex-direction: column; align-items: center; }
    .stat-label { font-size: 0.65em; text-transform: uppercase; font-weight: 600; opacity: 0.7; }
    .stat-value { font-size: 1.5em; font-weight: 800; line-height: 1.1; transition: 0.2s; }
    
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.6); color: #fff; text-shadow: 0 0 10px currentColor; } 100% { transform: scale(1); } }
    .pop-anim { animation: pop 0.4s ease-out; }

    .progress-bar { width: 100%; height: 6px; background: rgba(0,0,0,0.4); border-radius: 3px; margin-top: 10px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .p1 .progress-fill { background: var(--player1-color); box-shadow: 0 0 8px var(--player1-color); }
    .p2 .progress-fill { background: var(--player2-color); box-shadow: 0 0 8px var(--player2-color); }

    .vs-badge { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--player2-color), var(--player1-color)); font-weight: 800; font-size: 1.1em; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 2; margin: 0 -5px; flex-shrink: 0; border: 2px solid var(--bg-dark); }

    #turn-info { font-weight: 600; margin-bottom: 10px; color: #a1a1b5; letter-spacing: 1px; font-size: 0.9em; text-transform: uppercase; }
    
    .game-board { display: grid; grid-template-columns: repeat(8, var(--card-size)); gap: var(--board-gap); perspective: 1000px; }
    .card { width: var(--card-size); height: var(--card-size); position: relative; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1); cursor: pointer; }
    
    @keyframes cascadeIn { from { opacity: 0; transform: translateY(-30px) rotateY(-90deg) scale(0.8); } to { opacity: 1; transform: none; } }
    .cascade-in { animation: cascadeIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards; }
    
    .card:not(.flipped):not(.matched):hover { transform: translateY(-4px); }
    .card.flipped, .card.matched { transform: rotateY(180deg); cursor: default; }
    .card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: calc(var(--card-size) * 0.5); }
    
    .card-back { 
        background: repeating-linear-gradient(45deg, #16213e, #16213e 8px, #10182b 8px, #10182b 16px);
        border: 2px solid rgba(255,255,255,0.05); box-shadow: inset 0 0 10px rgba(0,0,0,0.5); transition: 0.2s;
    }
    .card:not(.flipped):not(.matched):hover .card-back { border-color: rgba(255,255,255,0.3); box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
    
    .card-front { background: var(--card-flipped); transform: rotateY(180deg); color: white; text-shadow: 0 4px 8px rgba(0,0,0,0.6); border: 2px solid transparent; transition: 0.3s; }
    
    .card.match-p1 .card-front { border-color: var(--player1-color); box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.3), 0 0 15px rgba(0, 240, 255, 0.4); color: var(--player1-color); }
    .card.match-p2 .card-front { border-color: var(--player2-color); box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.3), 0 0 15px rgba(255, 0, 85, 0.4); color: var(--player2-color); }

    .chat-container { width: 100%; max-width: 450px; background: rgba(22, 33, 62, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; margin-top: 15px;}
    .chat-messages { height: 120px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 0.85em; }
    .chat-msg { padding: 8px 12px; border-radius: 10px; max-width: 85%; }
    .chat-msg.opponent { background: rgba(255,255,255,0.05); align-self: flex-start; }
    .chat-msg.self { background: rgba(0, 240, 255, 0.1); align-self: flex-end; }
    .chat-form { display: flex; border-top: 1px solid rgba(255,255,255,0.1); }
    .chat-form input { flex: 1; padding: 12px; border: none; background: transparent; color: white; font-family: 'Poppins'; outline: none; }
    .chat-form button { border: none; padding: 0 20px; background: transparent; color: var(--player1-color); cursor: pointer; font-size: 1.1em; border-left: 1px solid rgba(255,255,255,0.1); }

    /* ================================================== */
    /* NOVA TELA DE VITÓRIA SUPREMA (MISTURA PREMIUM)     */
    /* ================================================== */
    #victory-modal {
        position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
    }
    #victory-modal.show { opacity: 1; pointer-events: all; }
    
    .victory-content {
        background: rgba(15, 15, 26, 0.9); border: 2px solid rgba(255,255,255,0.1);
        padding: 40px; border-radius: 24px; text-align: center; width: 90%; max-width: 400px;
        transform: scale(0.8) translateY(-50px); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }
    #victory-modal.show .victory-content { transform: scale(1) translateY(0); }
    
    #v-avatar { width: 80px; height: 80px; font-size: 2.5em; margin: 0 auto 15px; border: 3px solid transparent; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); }
    #v-title { margin: 0 0 5px 0; font-size: 2em; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
    #v-desc { font-size: 1.1em; color: #a1a1b5; margin-bottom: 25px; font-weight: 600; }
    
    /* Variações de cor por Vencedor */
    .v-theme-p1 { border-color: var(--player1-color) !important; box-shadow: 0 0 40px rgba(0, 240, 255, 0.2) !important; }
    .v-theme-p1 #v-title { color: var(--player1-color); text-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
    .v-theme-p1 #v-avatar { border-color: var(--player1-color); color: var(--player1-color); box-shadow: 0 0 20px rgba(0, 240, 255, 0.4); }

    .v-theme-p2 { border-color: var(--player2-color) !important; box-shadow: 0 0 40px rgba(255, 0, 85, 0.2) !important; }
    .v-theme-p2 #v-title { color: var(--player2-color); text-shadow: 0 0 15px rgba(255, 0, 85, 0.5); }
    .v-theme-p2 #v-avatar { border-color: var(--player2-color); color: var(--player2-color); box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); }

    .v-theme-tie { border-color: #ffd700 !important; box-shadow: 0 0 40px rgba(255, 215, 0, 0.2) !important; }
    .v-theme-tie #v-title { color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
    .v-theme-tie #v-avatar { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }

    .btn-action { width: 100%; padding: 15px; font-size: 1.1em; font-weight: 800; font-family: 'Poppins'; text-transform: uppercase; border: none; border-radius: 12px; cursor: pointer; color: white; transition: 0.2s; margin-bottom: 10px; }
    .btn-action:hover { transform: translateY(-2px); filter: brightness(1.2); }
    #modal-play-again { background: linear-gradient(135deg, #00f0ff, #0088ff); color: #000; box-shadow: 0 5px 15px rgba(0, 240, 255, 0.3); }
    #modal-reset { background: rgba(255,255,255,0.1); margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>Memória</h1>
  
  <div class="game-info">
    <div id="player1-card" class="player-card p1">
      <div class="player-header"><div class="avatar-wrapper"><i class="fa-solid fa-user-astronaut"></i></div><div class="player-name" id="p1-name">P1</div></div>
      <div class="stats-container"><div class="stat-box"><span class="stat-value" id="p1-score">0</span><span class="stat-label">Pares</span></div><div class="stat-box"><span class="stat-value" id="p1-wins">0</span><span class="stat-label" style="color:gold">Vit.</span></div></div>
      <div class="progress-bar"><div class="progress-fill" id="p1-progress"></div></div>
    </div>
    
    <div class="vs-badge">VS</div>
    
    <div id="player2-card" class="player-card p2">
      <div class="player-header"><div class="avatar-wrapper"><i class="fa-solid fa-user-ninja"></i></div><div class="player-name" id="p2-name">P2</div></div>
      <div class="stats-container"><div class="stat-box"><span class="stat-value" id="p2-score">0</span><span class="stat-label">Pares</span></div><div class="stat-box"><span class="stat-value" id="p2-wins">0</span><span class="stat-label" style="color:gold">Vit.</span></div></div>
      <div class="progress-bar"><div class="progress-fill" id="p2-progress"></div></div>
    </div>
  </div>
  
  <div id="turn-info"><i class="fa-solid fa-spinner fa-spin"></i> Conectando...</div>
  <div class="game-board" id="game-board"></div>
  
  <div class="chat-container"><div class="chat-messages" id="chat-messages"></div><form class="chat-form" id="chat-form"><input type="text" id="chat-input" placeholder="Chat privado..." required><button type="submit"><i class="fa-solid fa-paper-plane"></i></button></form></div>

  <div id="victory-modal">
    <div class="victory-content" id="v-content">
        <div id="v-avatar"><i class="fa-solid fa-trophy"></i></div>
        <h2 id="v-title">VITÓRIA!</h2>
        <p id="v-desc">Jogador venceu a partida!</p>
        <button id="modal-play-again" class="btn-action">Nova Partida</button>
        <button id="modal-reset" class="btn-action">Abandonar Sala</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyCLAsfQdpaEzk_5IFV39F0m_IyaFsGbAbc", authDomain: "jogo-da-memoria-lilica.firebaseapp.com", databaseURL: "https://jogo-da-memoria-lilica-default-rtdb.firebaseio.com", projectId: "jogo-da-memoria-lilica", storageBucket: "jogo-da-memoria-lilica.firebasestorage.app", messagingSenderId: "683788488529", appId: "1:683788488529:web:727316a3e182257a2d8d70" };
    firebase.initializeApp(firebaseConfig); const database = firebase.database();
    
    const icons = ['<i class="fa-solid fa-rocket"></i>', '<i class="fa-solid fa-ghost"></i>', '<i class="fa-solid fa-robot"></i>', '<i class="fa-solid fa-bug"></i>', '<i class="fa-solid fa-bolt"></i>', '<i class="fa-solid fa-fire"></i>', '<i class="fa-solid fa-snowflake"></i>', '<i class="fa-solid fa-cloud"></i>', '<i class="fa-solid fa-sun"></i>', '<i class="fa-solid fa-star"></i>', '<i class="fa-solid fa-gem"></i>', '<i class="fa-solid fa-bomb"></i>', '<i class="fa-solid fa-crown"></i>', '<i class="fa-solid fa-gamepad"></i>', '<i class="fa-solid fa-dice"></i>', '<i class="fa-solid fa-chess-knight"></i>', '<i class="fa-solid fa-anchor"></i>', '<i class="fa-solid fa-heart"></i>', '<i class="fa-solid fa-music"></i>', '<i class="fa-solid fa-paper-plane"></i>', '<i class="fa-solid fa-car"></i>', '<i class="fa-solid fa-bicycle"></i>', '<i class="fa-solid fa-umbrella"></i>', '<i class="fa-solid fa-mug-hot"></i>', '<i class="fa-solid fa-pizza-slice"></i>', '<i class="fa-solid fa-apple-whole"></i>', '<i class="fa-solid fa-ice-cream"></i>', '<i class="fa-solid fa-paw"></i>', '<i class="fa-solid fa-skull"></i>', '<i class="fa-solid fa-feather-pointed"></i>', '<i class="fa-solid fa-tree"></i>', '<i class="fa-solid fa-leaf"></i>'];
    const WINNING_SCORE = 17;

    let gameStateRef, gameId, playerId, checkMatchTimeout = null;
    window.currentTurn = 0; 
    let cachedScores = {1: -1, 2: -1}; 
    let confettiFired = false; // Controle para não disparar confetes infinitamente

    async function init() {
        gameId = new URLSearchParams(window.location.search).get('game');
        const myUUID = sessionStorage.getItem('jogoMemoriaUUID');
        if (!myUUID || !gameId) { window.location.href = 'index.html'; return; }
        gameStateRef = database.ref('games/' + gameId);
        
        gameStateRef.transaction(cs => {
            if (!cs) return cs;
            if (cs.player1_uuid === myUUID) { playerId = 1; } 
            else if (cs.player2_uuid === myUUID) { playerId = 2; } 
            else if (!cs.player2_uuid) {
                playerId = 2; cs.player2_uuid = myUUID; 
                cs.player2_name = sessionStorage.getItem('jogoMemoriaPlayerName') || 'P2'; 
            }
            return cs;
        }, (err, ok) => { 
            if (ok && playerId) setup(); 
            else { alert("Não foi possível entrar na sala."); window.location.href = 'index.html'; }
        });
    }

    function triggerPop(id) {
        const el = document.getElementById(id); el.classList.remove('pop-anim');
        void el.offsetWidth; el.classList.add('pop-anim');
    }
    
    // Função Suprema de Confetes
    function triggerEpicConfetti() {
        if (typeof confetti !== 'function') return;
        const duration = 3500; const end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 8, angle: 60, spread: 80, origin: { x: 0, y: 0.8 }, colors: ['#00f0ff', '#ff0055', '#ffffff', '#ffd700'] });
            confetti({ particleCount: 8, angle: 120, spread: 80, origin: { x: 1, y: 0.8 }, colors: ['#00f0ff', '#ff0055', '#ffffff', '#ffd700'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
    }

    function setup() {
        const boardEl = document.getElementById('game-board');
        
        gameStateRef.on('value', snap => {
            const s = snap.val(); if (!s) return;
            window.currentTurn = s.currentPlayer;

            document.getElementById('p1-name').textContent = s.player1_name || "P1";
            document.getElementById('p2-name').textContent = s.player2_name || "P2";
            
            if (cachedScores[1] !== -1 && s.scores[1] > cachedScores[1]) triggerPop('p1-score');
            if (cachedScores[2] !== -1 && s.scores[2] > cachedScores[2]) triggerPop('p2-score');
            cachedScores = { ...s.scores };

            document.getElementById('p1-score').textContent = s.scores[1]; document.getElementById('p1-wins').textContent = s.victories[1];
            document.getElementById('p2-score').textContent = s.scores[2]; document.getElementById('p2-wins').textContent = s.victories[2];
            
            document.getElementById('p1-progress').style.width = Math.min((s.scores[1] / WINNING_SCORE) * 100, 100) + '%';
            document.getElementById('p2-progress').style.width = Math.min((s.scores[2] / WINNING_SCORE) * 100, 100) + '%';

            document.getElementById('player1-card').classList.toggle('active', s.currentPlayer === 1);
            document.getElementById('player2-card').classList.toggle('active', s.currentPlayer === 2);
            
            const info = document.getElementById('turn-info');
            const gameWon = s.winner === 0 || s.winner === 1 || s.winner === 2;
            const modal = document.getElementById('victory-modal');
            const vContent = document.getElementById('v-content');
            
            if (gameWon) { 
                info.style.opacity = "0"; // Esconde o info
                
                // Configura o Pódio Majestoso
                vContent.className = 'victory-content'; // Reset
                if (s.winner === 1) {
                    vContent.classList.add('v-theme-p1');
                    document.getElementById('v-avatar').innerHTML = '<i class="fa-solid fa-user-astronaut"></i>';
                    document.getElementById('v-title').textContent = "VITÓRIA!";
                    document.getElementById('v-desc').textContent = `${s.player1_name} dominou a partida!`;
                } else if (s.winner === 2) {
                    vContent.classList.add('v-theme-p2');
                    document.getElementById('v-avatar').innerHTML = '<i class="fa-solid fa-user-ninja"></i>';
                    document.getElementById('v-title').textContent = "VITÓRIA!";
                    document.getElementById('v-desc').textContent = `${s.player2_name} dominou a partida!`;
                } else {
                    vContent.classList.add('v-theme-tie');
                    document.getElementById('v-avatar').innerHTML = '<i class="fa-solid fa-handshake"></i>';
                    document.getElementById('v-title').textContent = "EMPATE!";
                    document.getElementById('v-desc').textContent = "Uma batalha de gigantes equilibrada.";
                }
                
                modal.classList.add('show');
                
                // Dispara confetes apenas 1 vez por vitória
                if (!confettiFired) {
                    triggerEpicConfetti();
                    confettiFired = true;
                }
                
            } else {
                info.style.opacity = "1";
                modal.classList.remove('show');
                confettiFired = false; // Reseta para a próxima partida
                info.style.color = "#a1a1b5"; 
                info.textContent = s.currentPlayer === playerId ? "É a sua vez!" : "Aguarde a jogada de " + (s.currentPlayer === 1 ? s.player1_name : (s.player2_name || 'Oponente'));
            }

            const firstCard = document.getElementById('card-0');
            if (!firstCard || firstCard.dataset.emoji !== s.board[0].emoji) {
                boardEl.innerHTML = '';
                Object.values(s.board).forEach((c, i) => {
                    const el = document.createElement('div'); el.className = 'card cascade-in';
                    el.style.animationDelay = `${i * 0.015}s`; el.id = `card-${c.id}`; el.dataset.emoji = c.emoji;
                    el.innerHTML = `<div class="card-face card-front">${c.emoji}</div><div class="card-face card-back"></div>`;
                    
                    el.onclick = () => { if (!el.classList.contains('flipped') && !el.classList.contains('matched') && playerId === window.currentTurn && !checkMatchTimeout && !gameWon) flip(c.id); };
                    
                    boardEl.appendChild(el);
                    setTimeout(() => el.classList.remove('cascade-in'), 1500);
                });
            }

            Object.values(s.board).forEach(c => {
                const el = document.getElementById(`card-${c.id}`);
                if (el) {
                    el.classList.toggle('flipped', c.isFlipped);
                    if (c.isMatched) {
                        el.classList.add('matched');
                        if (c.matchedBy === 1) el.classList.add('match-p1'); else if (c.matchedBy === 2) el.classList.add('match-p2');
                    } else el.classList.remove('matched', 'match-p1', 'match-p2');
                }
            });

            if (s.flippedCards?.length === 2 && s.currentPlayer === playerId && !checkMatchTimeout) checkMatchTimeout = setTimeout(check, 1000);
        });

        const chatRef = database.ref('games/' + gameId + '/chat');
        document.getElementById('chat-form').onsubmit = e => {
            e.preventDefault(); const inp = document.getElementById('chat-input'); if(!inp.value.trim()) return;
            chatRef.push({ playerId, message: inp.value.trim() }); inp.value = '';
        };
        chatRef.limitToLast(20).on('child_added', snap => {
            const m = snap.val(); const d = document.createElement('div'); d.className = 'chat-msg ' + (m.playerId === playerId ? 'self' : 'opponent');
            d.textContent = m.message; document.getElementById('chat-messages').appendChild(d); document.getElementById('chat-messages').scrollTop = 9999;
        });
    }

    function flip(cardId) {
        gameStateRef.transaction(s => {
            if (!s || (s.winner === 0 || s.winner === 1 || s.winner === 2) || s.currentPlayer !== playerId) return;
            const flipped = s.flippedCards || []; if (flipped.length >= 2) return;
            s.board[cardId].isFlipped = true; s.flippedCards = [...flipped, cardId];
            return s;
        });
    }

    function check() {
        gameStateRef.transaction(s => {
            if (!s || !s.flippedCards || s.flippedCards.length !== 2) return;
            const [a, b] = s.flippedCards;
            if (s.board[a].emoji === s.board[b].emoji) {
                s.scores[playerId]++; s.board[a].isMatched = s.board[b].isMatched = true; s.matchedPairs++;
                s.board[a].matchedBy = playerId; s.board[b].matchedBy = playerId; 
            } else {
                s.board[a].isFlipped = s.board[b].isFlipped = false; s.currentPlayer = s.currentPlayer === 1 ? 2 : 1;
            }
            s.flippedCards = [];
            if (s.matchedPairs === 32) {
                if (s.scores[1] > s.scores[2]) s.winner = 1; else if (s.scores[2] > s.scores[1]) s.winner = 2; else s.winner = 0;
                if (s.winner !== 0) s.victories[s.winner]++;
            }
            return s;
        });
        checkMatchTimeout = null;
    }

    document.getElementById('modal-play-again').onclick = () => {
        gameStateRef.transaction(s => {
            if (!s) return; const pairs = [...icons, ...icons].sort(() => 0.5 - Math.random());
            s.board = {}; pairs.forEach((icon, i) => s.board[i] = { id: i, emoji: icon, isFlipped: false, isMatched: false, matchedBy: null });
            s.scores = { 1: 0, 2: 0 }; s.matchedPairs = 0; s.winner = null; s.flippedCards = []; s.chat = null;
            return s;
        });
    };
    
    document.getElementById('modal-reset').onclick = () => { 
        if(confirm('Tem certeza que deseja abandonar a sala? A partida será encerrada para você.')) {
            window.location.href = 'index.html'; 
        }
    };
    
    init();
  </script>
</body>
</html>
