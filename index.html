<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória - Lobby</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <meta name="theme-color" content="#16213e">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #1a1a2e; --card-color: #16213e; --text-color: #e94560; --accent-color: #ffffff;
            --player1-color: #53a8b6; --player2-color: #e94560;
        }
        body {
            font-family: 'Arial', sans-serif; background-color: var(--bg-color); color: var(--accent-color);
            display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        .lobby-container {
            background-color: var(--card-color); padding: 30px 40px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); text-align: center; width: 90%; max-width: 450px;
        }
        h1 { color: var(--text-color); margin-top: 0; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input[type="text"] {
            width: 100%; padding: 12px; font-size: 1.1em; text-align: center;
            background-color: var(--bg-color); border: 2px solid var(--text-color);
            color: var(--accent-color); border-radius: 8px; box-sizing: border-box;
        }
        .form-group input#game-id-input { text-transform: lowercase; }
        button {
            width: 100%; padding: 15px; font-size: 1.2em; font-weight: bold;
            color: var(--accent-color); background-color: var(--text-color);
            border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.3s; margin-top: 5px;
        }
        button:hover { background-color: #c93048; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .separator { margin: 25px 0; font-weight: bold; color: var(--accent-color); opacity: 0.6; }
        .chat-container { margin-top: 25px; border: 2px solid var(--text-color); border-radius: 8px; overflow: hidden; text-align: left; }
        .chat-messages { height: 200px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; background-color: var(--bg-color); }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background-color: var(--text-color); border-radius: 3px; }
        .chat-msg { max-width: 90%; padding: 8px 12px; border-radius: 12px; font-size: 0.9em; word-wrap: break-word; line-height: 1.4; background-color: #2a2a40; align-self: flex-start; }
        .chat-msg strong { display: block; margin-bottom: 3px; font-size: 0.9em; font-weight: bold; color: var(--player2-color); }
        .chat-msg.self { background-color: #0f3460; align-self: flex-end; border-top-right-radius: 0; }
        .chat-msg.self strong { color: var(--player1-color); }
        .chat-form { display: flex; }
        .chat-form input { flex-grow: 1; border: none; padding: 12px; font-size: 0.9em; background-color: var(--bg-color); color: var(--accent-color); border-top: 2px solid var(--text-color); }
        .chat-form button { padding: 12px 15px; font-size: 0.9em; border-radius: 0; margin: 0; width: auto; border-top: 2px solid var(--text-color); }
        @media (max-width: 480px) { .lobby-container { padding: 20px; } h1 { font-size: 1.8em; } }
    </style>
</head>
<body>
    <div class="lobby-container">
        <h1>Jogo da Memória Online</h1>
        <div class="form-group">
            <label for="player-name-input">Seu Nome</label>
            <input type="text" id="player-name-input" placeholder="Digite seu nome aqui">
        </div>
        <div class="form-group"><button id="create-game-btn">Criar Nova Sala</button></div>
        <div class="separator">OU</div>
        <div class="form-group">
            <label for="game-id-input">Digite o ID da Sala</label>
            <input type="text" id="game-id-input" placeholder="ex: foxyz">
        </div>
        <button id="join-game-btn">Entrar na Sala</button>
        <div class="chat-container">
            <div class="chat-messages" id="lobby-chat-messages"></div>
            <form class="chat-form" id="lobby-chat-form">
                <input type="text" id="lobby-chat-input" placeholder="Digite no lobby global..." autocomplete="off" required>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCLAsfQdpaEzk_5IFV39F0m_IyaFsGbAbc",
          authDomain: "jogo-da-memoria-lilica.firebaseapp.com",
          databaseURL: "https://jogo-da-memoria-lilica-default-rtdb.firebaseio.com",
          projectId: "jogo-da-memoria-lilica",
          storageBucket: "jogo-da-memoria-lilica.firebasestorage.app",
          messagingSenderId: "683788488529",
          appId: "1:683788488529:web:727316a3e182257a2d8d70"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        document.addEventListener('DOMContentLoaded', () => {
            const createBtn = document.getElementById('create-game-btn');
            const joinBtn = document.getElementById('join-game-btn');
            const gameIdInput = document.getElementById('game-id-input');
            const playerNameInput = document.getElementById('player-name-input');
            
            // --- LISTA MISTA DE 32 ÍCONES VETORIAIS ---
            const memoryIcons = [
                '<i class="fa-solid fa-rocket"></i>', '<i class="fa-solid fa-ghost"></i>', '<i class="fa-solid fa-robot"></i>', '<i class="fa-solid fa-bug"></i>',
                '<i class="fa-solid fa-bolt"></i>', '<i class="fa-solid fa-fire"></i>', '<i class="fa-solid fa-snowflake"></i>', '<i class="fa-solid fa-cloud"></i>',
                '<i class="fa-solid fa-sun"></i>', '<i class="fa-solid fa-star"></i>', '<i class="fa-solid fa-gem"></i>', '<i class="fa-solid fa-bomb"></i>',
                '<i class="fa-solid fa-crown"></i>', '<i class="fa-solid fa-gamepad"></i>', '<i class="fa-solid fa-dice"></i>', '<i class="fa-solid fa-chess-knight"></i>',
                '<i class="fa-solid fa-anchor"></i>', '<i class="fa-solid fa-heart"></i>', '<i class="fa-solid fa-music"></i>', '<i class="fa-solid fa-paper-plane"></i>',
                '<i class="fa-solid fa-car"></i>', '<i class="fa-solid fa-bicycle"></i>', '<i class="fa-solid fa-umbrella"></i>', '<i class="fa-solid fa-mug-hot"></i>',
                '<i class="fa-solid fa-pizza-slice"></i>', '<i class="fa-solid fa-apple-whole"></i>', '<i class="fa-solid fa-ice-cream"></i>', '<i class="fa-solid fa-paw"></i>',
                '<i class="fa-solid fa-skull"></i>', '<i class="fa-solid fa-feather-pointed"></i>', '<i class="fa-solid fa-tree"></i>', '<i class="fa-solid fa-leaf"></i>'
            ];
            
            let myPlayerUUID = sessionStorage.getItem('jogoMemoriaUUID');
            if (!myPlayerUUID) { myPlayerUUID = Math.random().toString(36).substr(2, 9); sessionStorage.setItem('jogoMemoriaUUID', myPlayerUUID); }
            playerNameInput.value = sessionStorage.getItem('jogoMemoriaPlayerName') || '';

            function getPlayerName() {
                const name = playerNameInput.value.trim();
                if (!name) { alert("Digite seu nome!"); playerNameInput.focus(); return null; }
                sessionStorage.setItem('jogoMemoriaPlayerName', name); return name;
            }

            createBtn.addEventListener('click', async () => {
                const playerName = getPlayerName(); if (!playerName) return;
                createBtn.disabled = true; createBtn.textContent = 'Criando...';
                const gameId = Math.random().toString(36).substr(2, 6);
                const gameStateRef = database.ref('games/' + gameId);
                const cardPairs = [...memoryIcons, ...memoryIcons].sort(() => 0.5 - Math.random());
                const initialBoard = {};
                cardPairs.forEach((icon, index) => { initialBoard[index] = { id: index, emoji: icon, isFlipped: false, isMatched: false }; });

                try {
                    await gameStateRef.set({ gameId, gameType: 'memory', player1_uuid: myPlayerUUID, player1_name: playerName, player2_uuid: null, player2_name: null, currentPlayer: 1, winner: null, victories: { 1: 0, 2: 0 }, board: initialBoard, scores: { 1: 0, 2: 0 }, flippedCards: [], matchedPairs: 0 });
                    await database.ref('lobby/chat').push({ timestamp: firebase.database.ServerValue.TIMESTAMP, uuid: myPlayerUUID, name: playerName, message: `Criei a sala: ${gameId}` });
                    window.location.href = `game.html?game=${gameId}`;
                } catch (e) { alert("Erro ao criar sala."); createBtn.disabled = false; }
            });

            joinBtn.addEventListener('click', () => {
                const playerName = getPlayerName(); if (!playerName) return;
                const gameId = gameIdInput.value.toLowerCase().trim();
                if (!gameId) { alert("ID da sala?"); return; }
                joinBtn.disabled = true;
                database.ref('games/' + gameId).once('value', snap => {
                    if (snap.exists() && snap.val().gameType === 'memory') {
                        if (!snap.val().player2_uuid || snap.val().player2_uuid === myPlayerUUID) {
                            if (!snap.val().player2_uuid) database.ref('games/' + gameId).update({ player2_name: playerName });
                            window.location.href = `game.html?game=${gameId}`;
                        } else { alert("Sala cheia!"); joinBtn.disabled = false; }
                    } else { alert("Não encontrada!"); joinBtn.disabled = false; }
                });
            });

            const lobbyChatRef = database.ref('lobby/chat');
            document.getElementById('lobby-chat-form').addEventListener('submit', e => {
                e.preventDefault(); const name = getPlayerName(); if(!name) return;
                const inp = document.getElementById('lobby-chat-input'); if(!inp.value.trim()) return;
                lobbyChatRef.push({ timestamp: firebase.database.ServerValue.TIMESTAMP, uuid: myPlayerUUID, name, message: inp.value.trim() });
                inp.value = '';
            });

            lobbyChatRef.limitToLast(50).on('child_added', snap => {
                const m = snap.val(); const div = document.createElement('div'); div.classList.add('chat-msg');
                if (m.uuid === myPlayerUUID) div.classList.add('self');
                div.innerHTML = `<strong>${m.name}</strong> ${m.message.replace(/</g, "&lt;")}`;
                const box = document.getElementById('lobby-chat-messages'); box.appendChild(div); box.scrollTop = box.scrollHeight;
            });

            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        });
    </script>
</body>
</html>
