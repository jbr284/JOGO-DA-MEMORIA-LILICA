<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Memória - Lobby</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <meta name="theme-color" content="#16213e">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f0f1a; --bg-light: #1a1a2e; --card-color: rgba(22, 33, 62, 0.6); 
            --text-color: #e94560; --accent-color: #ffffff;
            --player1-color: #00f0ff; --player2-color: #ff0055;
        }
        body {
            font-family: 'Poppins', sans-serif; color: var(--accent-color);
            background: radial-gradient(circle at center, var(--bg-light) 0%, var(--bg-dark) 100%);
            display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        
        /* GLASSMORPHISM */
        .lobby-container {
            background-color: var(--card-color); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px 40px; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 450px;
        }
        
        h1 { color: var(--accent-color); margin-top: 0; margin-bottom: 25px; font-weight: 800; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9em; letter-spacing: 1px; text-transform: uppercase; color: #a1a1b5; }
        .form-group input[type="text"] {
            width: 100%; padding: 14px; font-size: 1.1em; text-align: center; font-family: 'Poppins', sans-serif;
            background-color: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.1);
            color: var(--accent-color); border-radius: 10px; box-sizing: border-box; transition: 0.3s;
        }
        .form-group input[type="text"]:focus { outline: none; border-color: var(--player1-color); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
        .form-group input#game-id-input { text-transform: lowercase; letter-spacing: 2px; font-weight: 600; }
        
        button {
            width: 100%; padding: 15px; font-size: 1.1em; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            color: var(--accent-color); background: linear-gradient(135deg, var(--player2-color), #c93048);
            border: none; border-radius: 10px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 5px;
            font-family: 'Poppins', sans-serif;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(233, 69, 96, 0.4); }
        button#create-game-btn { background: linear-gradient(135deg, #00f0ff, #0088ff); color: #000; }
        button#create-game-btn:hover { box-shadow: 0 8px 20px rgba(0, 240, 255, 0.4); }
        button:disabled { background: #555; cursor: not-allowed; transform: none; box-shadow: none; color: #aaa; }
        
        .separator { margin: 25px 0; font-weight: 800; color: rgba(255,255,255,0.3); font-size: 0.9em; position: relative; }
        .separator::before, .separator::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: rgba(255,255,255,0.1); }
        .separator::before { left: 0; } .separator::after { right: 0; }
         
        .chat-container { margin-top: 25px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; text-align: left; background: rgba(0,0,0,0.2); }
        .chat-messages { height: 180px; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.2); border-radius: 3px; }
        
        .chat-msg { max-width: 90%; padding: 10px 14px; border-radius: 12px; font-size: 0.85em; line-height: 1.4; background-color: rgba(255,255,255,0.05); align-self: flex-start; }
        .chat-msg strong { display: block; margin-bottom: 4px; font-size: 0.9em; color: var(--player2-color); }
        .chat-msg.self { background-color: rgba(0, 240, 255, 0.1); align-self: flex-end; border-top-right-radius: 0; }
        .chat-msg.self strong { color: var(--player1-color); }
        
        .chat-form { display: flex; border-top: 1px solid rgba(255,255,255,0.1); }
        .chat-form input { flex-grow: 1; border: none; padding: 12px; font-size: 0.9em; background: transparent; color: var(--accent-color); font-family: 'Poppins', sans-serif; }
        .chat-form input:focus { outline: none; }
        .chat-form button { padding: 12px 20px; font-size: 0.9em; border-radius: 0; margin: 0; width: auto; background: transparent; color: var(--player1-color); box-shadow: none; border-left: 1px solid rgba(255,255,255,0.1); }
        .chat-form button:hover { transform: none; background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <div class="lobby-container">
        <h1>Memória Online</h1>
        <div class="form-group">
            <label for="player-name-input">Identificação</label>
            <input type="text" id="player-name-input" placeholder="O seu nome...">
        </div>
        <div class="form-group"><button id="create-game-btn">Criar Nova Sala</button></div>
        <div class="separator">OU</div>
        <div class="form-group">
            <input type="text" id="game-id-input" placeholder="ID da Sala (ex: foxyz)">
        </div>
        <button id="join-game-btn">Entrar na Sala</button>
        
        <div class="chat-container">
            <div class="chat-messages" id="lobby-chat-messages"></div>
            <form class="chat-form" id="lobby-chat-form">
                <input type="text" id="lobby-chat-input" placeholder="Mensagem global..." autocomplete="off" required>
                <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCLAsfQdpaEzk_5IFV39F0m_IyaFsGbAbc", authDomain: "jogo-da-memoria-lilica.firebaseapp.com",
          databaseURL: "https://jogo-da-memoria-lilica-default-rtdb.firebaseio.com", projectId: "jogo-da-memoria-lilica",
          storageBucket: "jogo-da-memoria-lilica.firebasestorage.app", messagingSenderId: "683788488529", appId: "1:683788488529:web:727316a3e182257a2d8d70"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        document.addEventListener('DOMContentLoaded', () => {
            const memoryIcons = [
                '<i class="fa-solid fa-rocket"></i>', '<i class="fa-solid fa-ghost"></i>', '<i class="fa-solid fa-robot"></i>', '<i class="fa-solid fa-bug"></i>',
                '<i class="fa-solid fa-bolt"></i>', '<i class="fa-solid fa-fire"></i>', '<i class="fa-solid fa-snowflake"></i>', '<i class="fa-solid fa-cloud"></i>',
                '<i class="fa-solid fa-sun"></i>', '<i class="fa-solid fa-star"></i>', '<i class="fa-solid fa-gem"></i>', '<i class="fa-solid fa-bomb"></i>',
                '<i class="fa-solid fa-crown"></i>', '<i class="fa-solid fa-gamepad"></i>', '<i class="fa-solid fa-dice"></i>', '<i class="fa-solid fa-chess-knight"></i>',
                '<i class="fa-solid fa-anchor"></i>', '<i class="fa-solid fa-heart"></i>', '<i class="fa-solid fa-music"></i>', '<i class="fa-solid fa-paper-plane"></i>',
                '<i class="fa-solid fa-car"></i>', '<i class="fa-solid fa-bicycle"></i>', '<i class="fa-solid fa-umbrella"></i>', '<i class="fa-solid fa-mug-hot"></i>',
                '<i class="fa-solid fa-pizza-slice"></i>', '<i class="fa-solid fa-apple-whole"></i>', '<i class="fa-solid fa-ice-cream"></i>', '<i class="fa-solid fa-paw"></i>',
                '<i class="fa-solid fa-skull"></i>', '<i class="fa-solid fa-feather-pointed"></i>', '<i class="fa-solid fa-tree"></i>', '<i class="fa-solid fa-leaf"></i>'
            ];
            
            let myPlayerUUID = sessionStorage.getItem('jogoMemoriaUUID');
            if (!myPlayerUUID) { myPlayerUUID = Math.random().toString(36).substr(2, 9); sessionStorage.setItem('jogoMemoriaUUID', myPlayerUUID); }
            document.getElementById('player-name-input').value = sessionStorage.getItem('jogoMemoriaPlayerName') || '';

            function getPlayerName() {
                const n = document.getElementById('player-name-input').value.trim();
                if (!n) { alert("Digite o seu nome!"); return null; }
                sessionStorage.setItem('jogoMemoriaPlayerName', n); return n;
            }

            document.getElementById('create-game-btn').addEventListener('click', async function() {
                const name = getPlayerName(); if (!name) return;
                this.disabled = true; this.textContent = 'Criando...';
                const gameId = Math.random().toString(36).substr(2, 6);
                const pairs = [...memoryIcons, ...memoryIcons].sort(() => 0.5 - Math.random());
                const initialBoard = {};
                pairs.forEach((e, i) => initialBoard[i] = { id: i, emoji: e, isFlipped: false, isMatched: false, matchedBy: null });
                
                await database.ref('games/' + gameId).set({ gameId, gameType: 'memory', player1_uuid: myPlayerUUID, player1_name: name, player2_uuid: null, player2_name: null, currentPlayer: 1, winner: null, victories: { 1: 0, 2: 0 }, board: initialBoard, scores: { 1: 0, 2: 0 }, flippedCards: [], matchedPairs: 0 });
                await database.ref('lobby/chat').push({ timestamp: firebase.database.ServerValue.TIMESTAMP, uuid: myPlayerUUID, name, message: `Sala Criada: ${gameId}` });
                window.location.href = `game.html?game=${gameId}`;
            });

            document.getElementById('join-game-btn').addEventListener('click', function() {
                const name = getPlayerName(); if (!name) return;
                const gameId = document.getElementById('game-id-input').value.toLowerCase().trim();
                if (!gameId) return alert("ID da sala?");
                this.disabled = true; this.textContent = 'Entrando...';
                database.ref('games/' + gameId).once('value', snap => {
                    if (snap.exists() && snap.val().gameType === 'memory') {
                        if (!snap.val().player2_uuid || snap.val().player2_uuid === myPlayerUUID) {
                            if (!snap.val().player2_uuid) database.ref('games/' + gameId).update({ player2_name: name });
                            window.location.href = `game.html?game=${gameId}`;
                        } else { alert("Sala cheia!"); this.disabled = false; this.textContent = 'Entrar na Sala'; }
                    } else { alert("Sala não encontrada!"); this.disabled = false; this.textContent = 'Entrar na Sala'; }
                });
            });

            const chatRef = database.ref('lobby/chat');
            document.getElementById('lobby-chat-form').onsubmit = e => {
                e.preventDefault(); const name = getPlayerName(); const inp = document.getElementById('lobby-chat-input');
                if(!name || !inp.value.trim()) return;
                chatRef.push({ timestamp: firebase.database.ServerValue.TIMESTAMP, uuid: myPlayerUUID, name, message: inp.value.trim() });
                inp.value = '';
            };

            chatRef.limitToLast(50).on('child_added', snap => {
                const m = snap.val(); const div = document.createElement('div'); div.className = 'chat-msg ' + (m.uuid === myPlayerUUID ? 'self' : '');
                div.innerHTML = `<strong>${m.name}</strong> ${m.message.replace(/</g, "&lt;")}`;
                const box = document.getElementById('lobby-chat-messages'); box.appendChild(div); box.scrollTop = box.scrollHeight;
            });

            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        });
    </script>
</body>
</html>
